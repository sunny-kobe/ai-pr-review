name: AI Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sunny-kobe/ai-pr-review@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          preset: mobile
